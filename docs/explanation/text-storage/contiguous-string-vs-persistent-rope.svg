<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title id="title">One edit, two representations</title>
  <desc id="description">A contiguous string copies unchanged bytes into a new allocation. A persistent rope creates a replacement leaf and new path while sharing unchanged subtrees. Both produce the same final text.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f6f1e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10233d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d36a16"/>
    </marker>
    <style>
      .heading { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #10233d; letter-spacing: 1px; }
      .stage { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #10233d; }
      .lane { font: 700 25px Inter, ui-sans-serif, system-ui, sans-serif; fill: #174f91; }
      .label { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #10233d; }
      .small { font: 650 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #10233d; }
      .tiny { font: 650 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #10233d; }
      .muted { fill: #6d7787; }
      .blue-fill { fill: #dcecff; stroke: #2468ad; stroke-width: 2.5; }
      .blue-node { fill: #dcecff; stroke: #2468ad; stroke-width: 3; }
      .green-fill { fill: #dff5d8; stroke: #3d8e43; stroke-width: 2.5; }
      .green-node { fill: #dff5d8; stroke: #3d8e43; stroke-width: 3; }
      .red-fill { fill: #ffe0dc; stroke: #d53e34; stroke-width: 2.5; }
      .red-node { fill: #ffe0dc; stroke: #d53e34; stroke-width: 3; }
      .orange-fill { fill: #ffead4; stroke: #d36a16; stroke-width: 2.5; }
      .orange-node { fill: #ffead4; stroke: #d36a16; stroke-width: 3; }
      .gray-fill { fill: #ecebe8; stroke: #89909a; stroke-width: 2; }
      .tree-blue { fill: none; stroke: #2468ad; stroke-width: 4; stroke-linecap: round; }
      .tree-orange { fill: none; stroke: #d36a16; stroke-width: 4; stroke-linecap: round; }
      .tree-red { fill: none; stroke: #d53e34; stroke-width: 4; stroke-linecap: round; }
      .tree-gray { fill: none; stroke: #a2a7ae; stroke-width: 3; stroke-linecap: round; }
      .share { fill: none; stroke: #2468ad; stroke-width: 3; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <text class="heading" x="800" y="68" text-anchor="middle">ONE EDIT, TWO REPRESENTATIONS</text>
  <text class="label muted" x="800" y="101" text-anchor="middle">Replace “BROWN FOX” with “RED CAT”</text>

  <g aria-label="stage headings">
    <circle cx="285" cy="145" r="24" fill="#174f91"/><text x="285" y="153" text-anchor="middle" font-family="Inter, sans-serif" font-size="23" font-weight="700" fill="white">1</text>
    <text class="stage" x="325" y="153">BEFORE</text>
    <circle cx="650" cy="145" r="24" fill="#174f91"/><text x="650" y="153" text-anchor="middle" font-family="Inter, sans-serif" font-size="23" font-weight="700" fill="white">2</text>
    <text class="stage" x="690" y="153">LOCATE EDIT</text>
    <circle cx="1015" cy="145" r="24" fill="#174f91"/><text x="1015" y="153" text-anchor="middle" font-family="Inter, sans-serif" font-size="23" font-weight="700" fill="white">3</text>
    <text class="stage" x="1055" y="153">BUILD RESULT</text>
    <circle cx="1360" cy="145" r="24" fill="#174f91"/><text x="1360" y="153" text-anchor="middle" font-family="Inter, sans-serif" font-size="23" font-weight="700" fill="white">4</text>
    <text class="stage" x="1400" y="153">AFTER</text>
  </g>

  <text class="lane" x="42" y="225">CONTIGUOUS</text>
  <text class="lane" x="82" y="257">STRING</text>
  <text class="small muted" x="61" y="284">one allocation</text>

  <g aria-label="contiguous string stages" filter="url(#shadow)">
    <g transform="translate(205 215)">
      <rect class="blue-fill" width="300" height="75" rx="18"/>
      <path d="M75 0V75 M150 0V75 M225 0V75" stroke="#2468ad" stroke-width="1.5" opacity="0.45"/>
      <text class="tiny" x="38" y="42" text-anchor="middle">THE QUICK</text>
      <text class="tiny" x="113" y="42" text-anchor="middle">BROWN FOX</text>
      <text class="tiny" x="188" y="42" text-anchor="middle">JUMPS OVER</text>
      <text class="tiny" x="263" y="42" text-anchor="middle">THE LAZY DOG</text>
    </g>
    <g transform="translate(570 215)">
      <rect class="blue-fill" width="300" height="75" rx="18"/>
      <rect class="red-fill" x="75" width="75" height="75"/>
      <path d="M75 0V75 M150 0V75 M225 0V75" stroke="#2468ad" stroke-width="1.5" opacity="0.45"/>
      <text class="tiny" x="38" y="42" text-anchor="middle">THE QUICK</text>
      <text class="tiny" x="113" y="42" text-anchor="middle" fill="#a21f19">BROWN FOX</text>
      <text class="tiny" x="188" y="42" text-anchor="middle">JUMPS OVER</text>
      <text class="tiny" x="263" y="42" text-anchor="middle">THE LAZY DOG</text>
    </g>
    <g transform="translate(935 203)">
      <rect class="gray-fill" width="300" height="42" rx="12" opacity="0.62"/>
      <text class="tiny muted" x="150" y="27" text-anchor="middle">OLD ALLOCATION</text>
      <path d="M150 48V70" stroke="#596579" stroke-width="3" marker-end="url(#arrow-gray)"/>
      <rect class="orange-fill" y="82" width="300" height="75" rx="18"/>
      <rect class="green-fill" x="75" y="82" width="75" height="75"/>
      <path d="M75 82V157 M150 82V157 M225 82V157" stroke="#d36a16" stroke-width="1.5" opacity="0.55"/>
      <text class="tiny" x="38" y="124" text-anchor="middle">THE QUICK</text>
      <text class="tiny" x="113" y="124" text-anchor="middle" fill="#236a2c">RED CAT</text>
      <text class="tiny" x="188" y="124" text-anchor="middle">JUMPS OVER</text>
      <text class="tiny" x="263" y="124" text-anchor="middle">THE LAZY DOG</text>
    </g>
    <g transform="translate(1280 215)">
      <rect class="orange-fill" width="300" height="75" rx="18"/>
      <rect class="green-fill" x="75" width="75" height="75"/>
      <path d="M75 0V75 M150 0V75 M225 0V75" stroke="#d36a16" stroke-width="1.5" opacity="0.55"/>
      <text class="tiny" x="38" y="42" text-anchor="middle">THE QUICK</text>
      <text class="tiny" x="113" y="42" text-anchor="middle">RED CAT</text>
      <text class="tiny" x="188" y="42" text-anchor="middle">JUMPS OVER</text>
      <text class="tiny" x="263" y="42" text-anchor="middle">THE LAZY DOG</text>
    </g>
  </g>
  <path d="M505 253H548" stroke="#596579" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <path d="M870 253H913" stroke="#596579" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <path d="M1237 253H1280" stroke="#596579" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <text x="1085" y="388" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#d36a16">UNCHANGED BYTES ARE COPIED</text>
  <text x="1430" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#3d8e43">SAME FINAL TEXT</text>

  <line x1="32" y1="430" x2="1568" y2="430" stroke="#b9b4aa" stroke-width="2"/>

  <text class="lane" x="42" y="505">PERSISTENT</text>
  <text class="lane" x="83" y="537">ROPE</text>
  <text class="small muted" x="52" y="564">tree of chunks</text>

  <g aria-label="persistent rope before" transform="translate(205 475)">
    <path class="tree-blue" d="M150 25L75 95 M150 25L225 95 M75 95L25 185 M75 95L105 185 M225 95L195 185 M225 95L275 185"/>
    <circle class="blue-node" cx="150" cy="25" r="18"/><circle class="blue-node" cx="75" cy="95" r="18"/><circle class="blue-node" cx="225" cy="95" r="18"/>
    <rect class="blue-fill" x="-15" y="185" width="80" height="58" rx="10"/><rect class="blue-fill" x="70" y="185" width="80" height="58" rx="10"/>
    <rect class="blue-fill" x="155" y="185" width="80" height="58" rx="10"/><rect class="blue-fill" x="240" y="185" width="80" height="58" rx="10"/>
    <text class="tiny" x="25" y="219" text-anchor="middle">THE QUICK</text><text class="tiny" x="110" y="219" text-anchor="middle">BROWN FOX</text>
    <text class="tiny" x="195" y="219" text-anchor="middle">JUMPS OVER</text><text class="tiny" x="280" y="219" text-anchor="middle">THE LAZY DOG</text>
  </g>

  <g aria-label="persistent rope locate edit" transform="translate(570 475)">
    <path class="tree-gray" d="M150 25L75 95 M150 25L225 95 M75 95L25 185 M225 95L195 185 M225 95L275 185"/>
    <path class="tree-red" d="M150 25L75 95 M75 95L110 185"/>
    <circle class="red-node" cx="150" cy="25" r="18"/><circle class="red-node" cx="75" cy="95" r="18"/><circle class="blue-node" cx="225" cy="95" r="18"/>
    <rect class="blue-fill" x="-15" y="185" width="80" height="58" rx="10"/><rect class="red-fill" x="70" y="185" width="80" height="58" rx="10"/>
    <rect class="blue-fill" x="155" y="185" width="80" height="58" rx="10"/><rect class="blue-fill" x="240" y="185" width="80" height="58" rx="10"/>
    <text class="tiny" x="25" y="219" text-anchor="middle">THE QUICK</text><text class="tiny" x="110" y="219" text-anchor="middle" fill="#a21f19">BROWN FOX</text>
    <text class="tiny" x="195" y="219" text-anchor="middle">JUMPS OVER</text><text class="tiny" x="280" y="219" text-anchor="middle">THE LAZY DOG</text>
  </g>

  <g aria-label="persistent rope build result" transform="translate(935 475)">
    <path class="tree-orange" d="M150 25L75 95 M75 95L110 185"/>
    <path class="share" d="M75 95L25 185 M150 25L225 95"/>
    <path class="tree-blue" d="M225 95L195 185 M225 95L275 185"/>
    <circle class="orange-node" cx="150" cy="25" r="18"/><circle class="orange-node" cx="75" cy="95" r="18"/><circle class="blue-node" cx="225" cy="95" r="18"/>
    <rect class="blue-fill" x="-15" y="185" width="80" height="58" rx="10"/><rect class="green-fill" x="70" y="185" width="80" height="58" rx="10"/>
    <rect class="blue-fill" x="155" y="185" width="80" height="58" rx="10"/><rect class="blue-fill" x="240" y="185" width="80" height="58" rx="10"/>
    <text class="tiny" x="25" y="219" text-anchor="middle">THE QUICK</text><text class="tiny" x="110" y="219" text-anchor="middle" fill="#236a2c">RED CAT</text>
    <text class="tiny" x="195" y="219" text-anchor="middle">JUMPS OVER</text><text class="tiny" x="280" y="219" text-anchor="middle">THE LAZY DOG</text>
    <text x="150" y="287" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#2468ad">UNCHANGED NODES ARE SHARED</text>
  </g>

  <g aria-label="persistent rope after" transform="translate(1280 475)">
    <path class="tree-orange" d="M130 25L65 95 M65 95L20 185 M65 95L95 185"/>
    <path class="tree-blue" d="M130 25L195 95 M195 95L165 185 M195 95L235 185"/>
    <circle class="orange-node" cx="130" cy="25" r="18"/><circle class="orange-node" cx="65" cy="95" r="18"/><circle class="blue-node" cx="195" cy="95" r="18"/>
    <rect class="blue-fill" x="-20" y="185" width="75" height="58" rx="10"/><rect class="green-fill" x="60" y="185" width="75" height="58" rx="10"/>
    <rect class="blue-fill" x="140" y="185" width="75" height="58" rx="10"/><rect class="blue-fill" x="220" y="185" width="75" height="58" rx="10"/>
    <text class="tiny" x="18" y="219" text-anchor="middle">THE QUICK</text><text class="tiny" x="98" y="219" text-anchor="middle">RED CAT</text>
    <text class="tiny" x="178" y="219" text-anchor="middle">JUMPS OVER</text><text class="tiny" x="258" y="219" text-anchor="middle">THE LAZY DOG</text>
  </g>
  <path d="M505 600H548" stroke="#596579" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <path d="M870 600H913" stroke="#596579" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <path d="M1237 600H1280" stroke="#596579" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <text x="1430" y="790" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#3d8e43">SAME FINAL TEXT</text>

  <g aria-label="legend" transform="translate(425 865)">
    <rect x="0" y="0" width="750" height="92" rx="18" fill="#fff" stroke="#a8afb8" stroke-width="2" filter="url(#shadow)"/>
    <circle class="orange-node" cx="70" cy="46" r="18"/><text class="label" x="103" y="52">COPIED / REBUILT</text>
    <circle class="green-node" cx="330" cy="46" r="18"/><text class="label" x="363" y="52">NEW TEXT</text>
    <circle class="blue-node" cx="520" cy="46" r="18"/><text class="label" x="553" y="52">SHARED NODE</text>
  </g>
</svg>
