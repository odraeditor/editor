<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" width="1200" height="560" viewBox="0 0 1200 560">
  <title id="title">One Buffer presented through two panes</title>
  <desc id="description">One shared Buffer owns canonical text and editing history. Pane A and Pane B each own a separate view with its own point, viewport, and buffer history.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579"/>
    </marker>
    <style>
      .title { font: 700 34px ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .heading { font: 700 24px ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .body { font: 500 19px ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .note { font: 600 17px ui-sans-serif, system-ui, sans-serif; fill: #536078; }
      .shared { fill: #fff0dd; stroke: #c65f16; stroke-width: 3; }
      .local { fill: #e8f0ff; stroke: #315f9b; stroke-width: 3; }
      .arrow { stroke: #596579; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fbfaf7"/>
  <text class="title" x="600" y="55" text-anchor="middle">SHARED TEXT, PANE-LOCAL PRESENTATION</text>
  <rect class="shared" x="350" y="95" width="500" height="135" rx="18"/>
  <text class="heading" x="600" y="140" text-anchor="middle">Buffer</text>
  <text class="body" x="600" y="178" text-anchor="middle">canonical text · document association · edit history</text>
  <path class="arrow" d="M500 230 C500 275 330 275 330 315"/>
  <path class="arrow" d="M700 230 C700 275 870 275 870 315"/>
  <rect class="local" x="90" y="320" width="480" height="160" rx="18"/>
  <text class="heading" x="330" y="365" text-anchor="middle">Pane A · View A</text>
  <text class="body" x="330" y="405" text-anchor="middle">point · viewport · desired column</text>
  <text class="body" x="330" y="438" text-anchor="middle">pane-local buffer history</text>
  <rect class="local" x="630" y="320" width="480" height="160" rx="18"/>
  <text class="heading" x="870" y="365" text-anchor="middle">Pane B · View B</text>
  <text class="body" x="870" y="405" text-anchor="middle">point · viewport · desired column</text>
  <text class="body" x="870" y="438" text-anchor="middle">pane-local buffer history</text>
  <text class="note" x="600" y="530" text-anchor="middle">Editing either view changes the shared Buffer; moving or scrolling changes only that view.</text>
</svg>
