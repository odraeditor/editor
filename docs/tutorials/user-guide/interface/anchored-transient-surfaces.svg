<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" width="1200" height="620" viewBox="0 0 1200 620">
  <title id="title">Completion and Gutter detail surfaces stay anchored to their source context</title>
  <desc id="description">A completion candidate surface opens beside the text cursor. A diagnostic detail surface opens beside a Gutter marker on the relevant line. Both preserve the document as the surrounding context.</desc>
  <style>
    .title { font: 700 31px ui-sans-serif, system-ui, sans-serif; fill: #172033; }
    .heading { font: 700 21px ui-sans-serif, system-ui, sans-serif; fill: #172033; }
    .body { font: 500 18px ui-monospace, monospace; fill: #172033; }
    .note { font: 600 17px ui-sans-serif, system-ui, sans-serif; fill: #536078; }
    .editor { fill: #f7f8fa; stroke: #657086; stroke-width: 3; }
    .gutter { fill: #e6eaf0; }
    .surface { fill: #fff0dd; stroke: #c65f16; stroke-width: 3; }
    .anchor { stroke: #c65f16; stroke-width: 4; stroke-dasharray: 7 6; }
  </style>
  <rect width="1200" height="620" fill="#fbfaf7"/>
  <text class="title" x="600" y="50" text-anchor="middle">CONTEXTUAL SURFACES REMAIN ANCHORED</text>
  <rect class="editor" x="70" y="90" width="1060" height="430" rx="18"/>
  <rect class="gutter" x="70" y="90" width="90" height="430" rx="18"/>
  <text class="body" x="105" y="145">12</text>
  <text class="body" x="105" y="190">13</text>
  <text class="body" x="105" y="235">14</text>
  <text class="body" x="105" y="280">15</text>
  <text class="body" x="105" y="325">16</text>
  <text class="body" x="205" y="145">forecast := fmt.</text>
  <line x1="366" y1="122" x2="366" y2="151" stroke="#172033" stroke-width="3"/>
  <text class="body" x="205" y="190">return summarize(forecast)</text>
  <text class="body" x="205" y="235">reading := observation +</text>
  <text class="body" x="205" y="280">publish(reading)</text>
  <text class="body" x="205" y="325">}</text>
  <rect class="surface" x="385" y="115" width="330" height="155" rx="12"/>
  <text class="heading" x="410" y="150">Completion candidates</text>
  <text class="body" x="410" y="188">printf      function</text>
  <text class="body" x="410" y="222">println     function</text>
  <line class="anchor" x1="366" y1="137" x2="385" y2="137"/>
  <circle cx="130" cy="232" r="12" fill="#c65f16"/>
  <rect class="surface" x="760" y="215" width="330" height="135" rx="12"/>
  <text class="heading" x="785" y="250">Diagnostic detail</text>
  <text class="body" x="785" y="290">expected an operand</text>
  <line class="anchor" x1="142" y1="232" x2="760" y2="232"/>
  <text class="note" x="550" y="575" text-anchor="middle">Position and line identity carry meaning; color only reinforces the relationship.</text>
</svg>
